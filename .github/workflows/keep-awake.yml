# Render's free plan sleeps after 15 idle minutes and takes ~1 minute to wake, so App Review would hit a cold start.
# ponytail: this keeps the API awake 24/7 (~744 of the workspace's 750 free hours/month, shared by every free
# Render service). Disable it here (Actions → keep-awake → Disable) once the apps are approved, or move to a paid
# instance. GitHub pauses scheduled workflows after 60 days without repo activity.
name: keep-awake
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS -m 90 --retry 2 --retry-delay 10 https://ambodo-api.onrender.com/health
